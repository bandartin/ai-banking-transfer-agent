[project]
name = "ai-banking-transfer-agent-awx-flow"
version = "0.1.0"
description = "AWX flow wrapper for the AI banking transfer agent"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.0.48",
    "pydantic==2.12.5",
    "langgraph==1.1.3",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langchain-core>=1.4.3,<2.0.0",
    "langchain-openai==1.3.0",
    "python-dotenv==1.2.2",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-flask",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-distro[otlp]",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "config", "seed"]
