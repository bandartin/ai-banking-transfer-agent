[project]
name = "mcp-server-auto-otel-guide"
version = "0.1.0"
description = "MCP Server with OpenTelemetry Auto Instrumentation Guide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    # FastMCP
    "fastmcp>=3.0.0b1",
    # OpenTelemetry (openinference 제외)
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-mcp",
    "opentelemetry-distro[otlp]",
    # 환경 변수 관리
    "python-dotenv",
    # 암호화 및 인증
    "cryptography>=46.0.3",
    "authlib>=1.6.6",
    # Key-Value 저장소
    "py-key-value-shared>=0.3.0",
    "py-key-value-aio>=0.3.0",
]
