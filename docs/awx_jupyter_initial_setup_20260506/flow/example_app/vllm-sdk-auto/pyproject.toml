[project]
name = "vllm-sdk-auto"
version = "0.1.0"
description = "Minimal vLLM custom model example with AWX SDK and OTel export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "opentelemetry-distro[otlp]",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-openai",
]

[tool.uv]
package = false
default-groups = []
