[project]
name = "guardrail-sdk-auto"
version = "0.1.0"
description = "Minimal example app that uses awx filter SDK only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "opentelemetry-distro[otlp]",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-openai",
]

[tool.uv]
package = false
default-groups = []
